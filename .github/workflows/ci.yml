name: Verify AlgoLadder
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: algoladder_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/algoladder_test
      PGSSLMODE: disable
      AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      MOCK_SUBSCRIPTIONS: 'true'
      NEXT_PUBLIC_MOCK_SUBSCRIPTIONS: 'true'
      EMAIL_ENABLED: 'false'
      ALLOW_DEV_RESET_LINKS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate && npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
